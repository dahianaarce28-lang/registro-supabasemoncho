<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Institucional - Moncho (Supabase)</title>
    <!-- Conectado al archivo de estilos externo -->
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <!-- Fondo de estrellas destellantes -->
    <div class="stars-bg"></div>

    <div class="card">
        <!-- Media luna y estrella brillante en el encabezado -->
        <div class="header-icon">🌙✨</div>
        <h2>Registro Institucional</h2>
        <div class="subtitle">Dominio obligatorio: <strong>@asuncionescalada.edu.py</strong></div>

        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="usuario@asuncionescalada.edu.py">
        </div>

        <div class="input-group">
            <label for="password">Contraseña (Mínimo 6 caracteres)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="btnRegister">Registrarse con Estilo</button>

        <div id="msgBox" class="msg"></div>
    </div>

    <!-- SDK de Supabase cargado vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // CONFIGURACIÓN DE SUPABASE (Reemplaza con tus credenciales reales de tu panel)
        const SUPABASE_URL = 'https://gbllloxtlsmlsdeimkcxp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vwF5a94urat93oBzn2NJXg_S7CnPyR0';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const DOMINIO_PERMITIDO = "@asuncionescalada.edu.py";

        const btnRegister = document.getElementById("btnRegister");
        const msgBox = document.getElementById("msgBox");

        function mostrarMensaje(texto, tipo) {
            msgBox.style.display = "block";
            msgBox.textContent = texto;
            msgBox.className = "msg " + tipo;
        }

        btnRegister.addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            // Validación estricta de dominio en el Frontend
            if (!email.endsWith(DOMINIO_PERMITIDO)) {
                mostrarMensaje(`Acceso denegado: Solo se permiten correos del dominio ${DOMINIO_PERMITIDO}`, "error");
                return;
            }

            if (password.length < 6) {
                mostrarMensaje("La contraseña debe tener al menos 6 caracteres.", "error");
                return;
            }

            // Registro en Supabase Auth
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                mostrarMensaje(`Error en el registro: ${error.message}`, "error");
            } else {
                mostrarMensaje(`¡Registro exitoso! Usuario creado correctamente en Supabase. ✨`, "success");
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
            }
        });
    </script>
</body>
</html>
